services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file: ./apps/web/.env.local
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  resolver:
    build:
      context: .
      dockerfile: Dockerfile.resolver
    env_file: ./apps/web/.env.local
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
