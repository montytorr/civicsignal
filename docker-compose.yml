services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    image: civicsignal-web:latest
    container_name: civicsignal-web
    expose:
      - "3000"
    env_file: ${CIVICSIGNAL_ENV_FILE:-/home/runner/civicsignal-secrets/web.env}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Database migrations run through docker exec; never retain a retired
      # managed database URL in an application container.
      SUPABASE_DB_URL: ""
    restart: unless-stopped
    networks:
      - trading-v2-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.civicsignal.rule=Host(`civicsignal.montytorr.com`)"
      - "traefik.http.routers.civicsignal.entrypoints=websecure"
      - "traefik.http.routers.civicsignal.tls.certresolver=letsencrypt"
      - "traefik.http.services.civicsignal.loadbalancer.server.port=3000"
      - "traefik.docker.network=trading-v2-network"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  resolver:
    build:
      context: .
      dockerfile: Dockerfile.resolver
    image: civicsignal-resolver:latest
    container_name: civicsignal-resolver
    env_file: ${CIVICSIGNAL_ENV_FILE:-/home/runner/civicsignal-secrets/web.env}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: ""
    restart: unless-stopped
    networks:
      - trading-v2-network
    depends_on:
      web:
        condition: service_healthy

networks:
  trading-v2-network:
    external: true
